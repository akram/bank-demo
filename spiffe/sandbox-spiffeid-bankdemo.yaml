apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: openshell-sandboxes-bankdemo
spec:
  className: zero-trust-workload-identity-manager-spire
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: bank-demo
  podSelector:
    matchExpressions:
    - key: agents.x-k8s.io/sandbox-name-hash
      operator: Exists
  spiffeIDTemplate: "spiffe://openshell.local/openshell/sandbox/{{ index .PodMeta.Annotations \"openshell.io/sandbox-id\" }}"
