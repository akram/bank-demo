id: bank-services
display_name: Bank Services (descoped via token exchange)
description: Bank API with SPIFFE token exchange and CEO identity delegation
category: other

credentials:
  - name: user_identity_token
    description: User token obtained via SPIFFE token exchange
    required: false
    auth_style: bearer
    header_name: Authorization
    token_grant:
      grant_type: token_exchange
      token_endpoint: http://token-exchange-issuer.bank-demo.svc.cluster.local/token
      audience: bank-api
      jwt_svid_audience: http://token-exchange-issuer.bank-demo.svc.cluster.local
      client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-spiffe
      scopes: [accounts.read, transfers.read]
      cache_ttl_seconds: 60
      requested_token_type: urn:ietf:params:oauth:token-type:access_token
      subject_token:
        source: sandbox_delegated_identity
        credential: ""

endpoints:
  - host: bank-api.bank-demo.svc.cluster.local
    port: 80
    protocol: rest
    tls: none
    access: read-write
    enforcement: enforce

binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
  - /usr/local/bin/claude
  - /usr/bin/node
