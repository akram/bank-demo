version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  bank_api:
    name: bank-api
    endpoints:
      - host: bank-api.default.svc.cluster.local
        port: 80
        protocol: rest
        tls: none
        access: read-write
        enforcement: enforce
    binaries:
      - path: /usr/bin/curl
      - path: /usr/local/bin/curl
      - path: /usr/local/bin/claude
      - path: /usr/bin/node
  inference:
    name: inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/local/bin/claude
      - path: /usr/bin/node
