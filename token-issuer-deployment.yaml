apiVersion: v1
kind: Secret
metadata:
  name: token-issuer-secret
  namespace: bank-demo
type: Opaque
stringData:
  ACCESS_TOKEN_SECRET: "bank-demo-token-secret-2026-openshell"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-exchange-issuer
  namespace: bank-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-exchange-issuer
  template:
    metadata:
      labels:
        app: token-exchange-issuer
    spec:
      containers:
      - name: token-issuer
        image: registry.access.redhat.com/ubi9/nodejs-22:latest
        command: ["node", "/app/token-issuer.js"]
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: SPIRE_JWKS_URI
          value: "https://spire-spiffe-oidc-discovery-provider.zero-trust-workload-identity-manager.svc.cluster.local/keys"
        - name: SPIRE_ISSUER
          value: "https://spire-oidc-discovery-provider.zero-trust-workload-identity-manager.svc.cluster.local"
        - name: JWT_SVID_AUDIENCE
          value: "http://token-exchange-issuer.bank-demo.svc.cluster.local"
        - name: GATEWAY_TRUST_DOMAIN_PREFIX
          value: "spiffe://openshell.local/ns/openshell-system/sa/"
        - name: SUPERVISOR_TRUST_DOMAIN_PREFIX
          value: "spiffe://openshell.local/openshell/sandbox/"
        - name: ACCESS_TOKEN_ISSUER
          value: "http://token-exchange-issuer.bank-demo.svc.cluster.local"
        - name: DEMO_USER_SUBJECT
          value: "ceo"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: ACCESS_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: token-issuer-secret
              key: ACCESS_TOKEN_SECRET
        - name: SPIRE_JWKS_CA_FILE
          value: "/spiffe-bundle/bundle.crt"
        volumeMounts:
        - name: code
          mountPath: /app
        - name: spiffe-bundle
          mountPath: /spiffe-bundle
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
      - name: spiffe-helper
        image: ghcr.io/spiffe/spiffe-helper:0.8.0
        command: ["/spiffe-helper"]
        args: ["-config", "/etc/spiffe-helper/helper.conf"]
        volumeMounts:
        - name: spiffe-helper-config
          mountPath: /etc/spiffe-helper
        - name: spiffe-bundle
          mountPath: /spiffe-bundle
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: token-issuer-code
      - name: spiffe-helper-config
        configMap:
          name: spiffe-helper-config
      - name: spiffe-bundle
        emptyDir: {}
      - name: spiffe-workload-api
        csi:
          driver: csi.spiffe.io
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: token-exchange-issuer
  namespace: bank-demo
spec:
  selector:
    app: token-exchange-issuer
  ports:
  - port: 80
    targetPort: 8080
