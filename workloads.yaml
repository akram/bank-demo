apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-api-code
  namespace: default
data:
  bank-api.js: |
    PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-api
  template:
    metadata:
      labels:
        app: bank-api
    spec:
      containers:
      - name: bank-api
        image: node:22-alpine
        command: ["node", "/app/bank-api.js"]
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: KEYCLOAK_JWKS_URI
          value: "https://keycloak-keycloak.apps.rosa.akram-dev.b5xj.p3.openshiftapps.com/realms/bank-demo/protocol/openid-connect/certs"
        - name: KEYCLOAK_ISSUER
          value: "https://keycloak-keycloak.apps.rosa.akram-dev.b5xj.p3.openshiftapps.com/realms/bank-demo"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        volumeMounts:
        - name: code
          mountPath: /app
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
      volumes:
      - name: code
        configMap:
          name: bank-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: bank-api
  namespace: default
spec:
  selector:
    app: bank-api
  ports:
  - port: 80
    targetPort: 8080
